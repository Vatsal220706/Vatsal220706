name: Update GitHub Stats Card

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats Card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import json
          import math
          import os
          import urllib.request
          from pathlib import Path

          USERNAME = "Vatsal220706"

          API = "https://api.github.com"

          HEADERS = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }


          def github_api(url):
              request = urllib.request.Request(
                  url,
                  headers=HEADERS
              )

              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read())


          # -------------------------------------------------
          # 1. USER / REPOSITORY DATA
          # -------------------------------------------------

          user = github_api(
              f"{API}/users/{USERNAME}"
          )

          repositories = user["public_repos"]


          # -------------------------------------------------
          # 2. COMMITS
          # -------------------------------------------------

          commit_data = github_api(
              f"{API}/search/commits?q=author:{USERNAME}"
          )

          commits = commit_data["total_count"]


          # -------------------------------------------------
          # 3. PULL REQUESTS
          # -------------------------------------------------

          pr_data = github_api(
              f"{API}/search/issues?q=author:{USERNAME}+type:pr"
          )

          pull_requests = pr_data["total_count"]


          # -------------------------------------------------
          # 4. ISSUES
          # -------------------------------------------------

          issue_data = github_api(
              f"{API}/search/issues?q=author:{USERNAME}+type:issue"
          )

          issues = issue_data["total_count"]


          # -------------------------------------------------
          # 5. STARS
          # -------------------------------------------------

          stars = 0
          page = 1

          while True:

              repos = github_api(
                  f"{API}/users/{USERNAME}/repos"
                  f"?per_page=100&page={page}"
              )

              if not repos:
                  break

              for repo in repos:
                  stars += repo["stargazers_count"]

              if len(repos) < 100:
                  break

              page += 1


          # -------------------------------------------------
          # VALUES
          # -------------------------------------------------

          values = [
              commits,
              pull_requests,
              issues,
              stars,
              repositories
          ]

          total = sum(values)

          # Avoid division by zero
          if total == 0:
              total = 1


          # -------------------------------------------------
          # COLORS
          # -------------------------------------------------

          colors = [
              "#3B82F6",  # Blue - Commits
              "#8B5CF6",  # Purple - Pull Requests
              "#22C55E",  # Green - Issues
              "#F59E0B",  # Orange - Stars
              "#EC4899"   # Pink - Repositories
          ]


          labels = [
              "Commits",
              "Pull Requests",
              "Issues",
              "Stars",
              "Repositories"
          ]


          # -------------------------------------------------
          # DONUT CALCULATION
          # -------------------------------------------------

          cx = 145
          cy = 150
          radius = 92
          inner_radius = 60

          circumference = 2 * math.pi * radius

          offset = 0

          donut_segments = []

          for value, color in zip(values, colors):

              percentage = value / total

              dash = percentage * circumference

              donut_segments.append(
                  f'''
                  <circle
                      cx="{cx}"
                      cy="{cy}"
                      r="{radius}"
                      fill="none"
                      stroke="{color}"
                      stroke-width="25"
                      stroke-dasharray="{dash:.2f} {circumference:.2f}"
                      stroke-dashoffset="-{offset:.2f}"
                      transform="rotate(-90 {cx} {cy})"
                  />
                  '''
              )

              offset += dash


          donut = "\n".join(donut_segments)


          # -------------------------------------------------
          # LEGEND
          # -------------------------------------------------

          legend = []

          start_y = 75
          gap = 40

          for i, (label, value, color) in enumerate(
              zip(labels, values, colors)
          ):

              y = start_y + i * gap

              # IMPORTANT:
              # Repositories uses a plain SVG circle.
              # No emoji / heart is used.

              legend.append(
                  f'''
                  <circle
                      cx="355"
                      cy="{y - 5}"
                      r="6"
                      fill="{color}"
                  />

                  <text
                      x="375"
                      y="{y}"
                      font-family="Arial, Helvetica, sans-serif"
                      font-size="15"
                      fill="#C9D1D9"
                  >
                      {label}
                  </text>

                  <text
                      x="640"
                      y="{y}"
                      text-anchor="end"
                      font-family="Arial, Helvetica, sans-serif"
                      font-size="15"
                      font-weight="bold"
                      fill="#FFFFFF"
                  >
                      {value}
                  </text>
                  '''
              )


          legend_svg = "\n".join(legend)


          # -------------------------------------------------
          # FINAL SVG
          # -------------------------------------------------

          svg = f'''
          <svg
              width="700"
              height="320"
              viewBox="0 0 700 320"
              xmlns="http://www.w3.org/2000/svg"
          >

              <defs>

                  <linearGradient
                      id="background"
                      x1="0"
                      y1="0"
                      x2="1"
                      y2="1"
                  >
                      <stop
                          offset="0%"
                          stop-color="#0D1117"
                      />

                      <stop
                          offset="100%"
                          stop-color="#161B22"
                      />
                  </linearGradient>

              </defs>


              <!-- CARD -->

              <rect
                  x="1"
                  y="1"
                  width="698"
                  height="318"
                  rx="18"
                  fill="url(#background)"
                  stroke="#30363D"
              />


              <!-- TITLE -->

              <text
                  x="30"
                  y="38"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="20"
                  font-weight="bold"
                  fill="#FFFFFF"
              >
                  GitHub Statistics
              </text>


              <!-- DONUT -->

              {donut}


              <!-- DONUT CENTER -->

              <circle
                  cx="{cx}"
                  cy="{cy}"
                  r="{inner_radius}"
                  fill="#0D1117"
              />

              <text
                  x="{cx}"
                  y="{cy - 5}"
                  text-anchor="middle"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="22"
                  font-weight="bold"
                  fill="#FFFFFF"
              >
                  {total}
              </text>

              <text
                  x="{cx}"
                  y="{cy + 18}"
                  text-anchor="middle"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="12"
                  fill="#8B949E"
              >
                  Total
              </text>


              <!-- LEGEND -->

              {legend_svg}


              <!-- FOOTER -->

              <text
                  x="350"
                  y="295"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="11"
                  fill="#6E7681"
              >
                  @Vatsal220706
              </text>

          </svg>
          '''


          # -------------------------------------------------
          # SAVE
          # -------------------------------------------------

          output = Path("assets")
          output.mkdir(exist_ok=True)

          file = output / "github-stats.svg"

          file.write_text(
              svg.strip(),
              encoding="utf-8"
          )

          print("===================================")
          print("GitHub Stats Updated")
          print("===================================")
          print(f"Commits:        {commits}")
          print(f"Pull Requests:  {pull_requests}")
          print(f"Issues:         {issues}")
          print(f"Stars:          {stars}")
          print(f"Repositories:   {repositories}")
          print("===================================")

          PY


      - name: Commit updated card
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg

          git diff --cached --quiet || \
            git commit -m "chore: update GitHub stats"

          git push