name: Update GitHub Stats Card

on:
  push:
    branches:
      - main
      - vatsal
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PY'
          import json
          import math
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone

          USERNAME = "Vatsal220706"
          OUTPUT_STATS = "assets/github-stats.svg"
          OUTPUT_PROFILE = "assets/profile-details.svg"
          OUTPUT_STREAK = "assets/streak-stats.svg"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          def api(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          def graphql(query):
              data = json.dumps({"query": query}).encode("utf-8")
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=data,
                  headers={
                      **headers,
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          # =============================
          # GET USER INFORMATION
          # =============================

          user = api(f"https://api.github.com/users/{USERNAME}")

          repositories = user["public_repos"]
          created_at = user["created_at"]

          # Calculate "Joined X ago"
          created_date = datetime.strptime(created_at, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
          now = datetime.now(timezone.utc)
          diff_days = (now - created_date).days
          if diff_days >= 365:
              years = diff_days // 365
              joined_text = f"Joined GitHub {years} year{'s' if years > 1 else ''} ago"
          elif diff_days >= 30:
              months = diff_days // 30
              joined_text = f"Joined GitHub {months} month{'s' if months > 1 else ''} ago"
          else:
              joined_text = f"Joined GitHub {diff_days} day{'s' if diff_days > 1 else ''} ago"

          # =============================
          # GET ALL PUBLIC REPOSITORIES
          # =============================

          repos = []
          page = 1

          while True:
              data = api(
                  f"https://api.github.com/users/{USERNAME}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1

          stars = sum(repo["stargazers_count"] for repo in repos)

          # =============================
          # PULL REQUESTS
          # =============================

          pr_data = api(
              f"https://api.github.com/search/issues"
              f"?q=author:{USERNAME}+type:pr"
          )

          pull_requests = pr_data["total_count"]

          # =============================
          # ISSUES
          # =============================

          issue_data = api(
              f"https://api.github.com/search/issues"
              f"?q=author:{USERNAME}+type:issue"
          )

          issues = issue_data["total_count"]

          # =============================
          # COMMITS
          # =============================

          commit_data = api(
              f"https://api.github.com/search/commits"
              f"?q=author:{USERNAME}"
          )

          commits = commit_data["total_count"]

          # =============================
          # CONTRIBUTION CALENDAR (GraphQL)
          # =============================

          # Calculate date range for last year
          from_date = (now - timedelta(days=365)).strftime("%Y-%m-%dT00:00:00Z")
          to_date = now.strftime("%Y-%m-%dT23:59:59Z")

          gql_query = """
          {
            user(login: "%s") {
              contributionsCollection(from: "%s", to: "%s") {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          """ % (USERNAME, from_date, to_date)

          gql_result = graphql(gql_query)
          calendar = gql_result["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          # Use a consistent total across all cards (sum of all public activities)
          total_contributions = commits + pull_requests + issues + stars + repositories

          # Flatten all contribution days
          all_days = []
          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  all_days.append({
                      "date": day["date"],
                      "count": day["contributionCount"]
                  })

          # Sort by date
          all_days.sort(key=lambda d: d["date"])

          # =============================
          # CALCULATE STREAKS
          # =============================

          today_str = now.strftime("%Y-%m-%d")

          # Current streak: count consecutive days with contributions ending today (or yesterday)
          current_streak = 0
          current_streak_start = None
          current_streak_end = None

          # Work backwards from the most recent day
          for i in range(len(all_days) - 1, -1, -1):
              day = all_days[i]
              if day["date"] > today_str:
                  continue
              if current_streak == 0:
                  # First day we check - if no contributions today, check yesterday
                  if day["count"] > 0:
                      current_streak = 1
                      current_streak_end = day["date"]
                      current_streak_start = day["date"]
                  elif day["date"] == today_str:
                      continue  # Today has 0, check yesterday
                  else:
                      break
              else:
                  if day["count"] > 0:
                      current_streak += 1
                      current_streak_start = day["date"]
                  else:
                      break

          # Longest streak
          longest_streak = 0
          longest_start = None
          longest_end = None
          temp_streak = 0
          temp_start = None

          for day in all_days:
              if day["count"] > 0:
                  if temp_streak == 0:
                      temp_start = day["date"]
                  temp_streak += 1
                  if temp_streak > longest_streak:
                      longest_streak = temp_streak
                      longest_start = temp_start
                      longest_end = day["date"]
              else:
                  temp_streak = 0

          # Format dates for display
          def format_date_short(date_str):
              if not date_str:
                  return ""
              d = datetime.strptime(date_str, "%Y-%m-%d")
              return d.strftime("%b %d")

          def format_date_range(start, end):
              if not start or not end:
                  return ""
              return f"{format_date_short(start)} - {format_date_short(end)}"

          # First contribution date
          first_contribution_date = None
          for day in all_days:
              if day["count"] > 0:
                  first_contribution_date = day["date"]
                  break

          contribution_range = ""
          if first_contribution_date:
              d = datetime.strptime(first_contribution_date, "%Y-%m-%d")
              contribution_range = f"{d.strftime('%b %d, %Y')} - Present"

          # =============================
          # WEEKLY CONTRIBUTION DATA (for chart)
          # =============================

          # Group by week and get weekly totals
          weekly_totals = []
          for week in calendar["weeks"]:
              week_total = sum(day["contributionCount"] for day in week["contributionDays"])
              week_date = week["contributionDays"][0]["date"]
              weekly_totals.append({"date": week_date, "count": week_total})

          max_weekly = max((w["count"] for w in weekly_totals), default=1)
          if max_weekly == 0:
              max_weekly = 1

          # =============================================================
          #  CARD 1: GITHUB STATISTICS DONUT
          # =============================================================

          values = [
              commits,
              pull_requests,
              issues,
              stars,
              repositories
          ]

          colors = [
              "#3B82F6",
              "#8B5CF6",
              "#22C55E",
              "#F59E0B",
              "#EC4899"
          ]

          labels = [
              "Commits",
              "Pull Requests",
              "Issues",
              "Stars",
              "Repositories"
          ]

          total = total_contributions

          # Prevent division by zero
          if total == 0:
              total = 1

          # Donut settings
          cx = 145
          cy = 150
          radius = 92

          circumference = 2 * math.pi * radius

          circles = []

          offset = 0

          for value, color in zip(values, colors):

              length = circumference * value / total

              circles.append(f"""
              <circle
                  cx="{cx}"
                  cy="{cy}"
                  r="{radius}"
                  fill="none"
                  stroke="{color}"
                  stroke-width="25"
                  stroke-dasharray="{length:.2f} {circumference:.2f}"
                  stroke-dashoffset="-{offset:.2f}"
                  transform="rotate(-90 {cx} {cy})"
              />
              """)

              offset += length

          donut = "".join(circles)

          # Legend
          legend = ""

          y_positions = [70, 110, 150, 190, 230]

          for label, value, color, y in zip(
              labels,
              values,
              colors,
              y_positions
          ):

              legend += f"""
              <circle
                  cx="355"
                  cy="{y}"
                  r="6"
                  fill="{color}"
              />

              <text
                  x="375"
                  y="{y + 5}"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="15"
                  fill="#C9D1D9"
              >
                  {label}
              </text>

              <text
                  x="640"
                  y="{y + 5}"
                  text-anchor="end"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="15"
                  font-weight="bold"
                  fill="#FFFFFF"
              >
                  {value}
              </text>
              """

          svg_stats = f"""<svg
              width="700"
              height="320"
              viewBox="0 0 700 320"
              xmlns="http://www.w3.org/2000/svg"
          >

              <defs>

                  <linearGradient
                      id="background"
                      x1="0"
                      y1="0"
                      x2="1"
                      y2="1"
                  >
                      <stop
                          offset="0%"
                          stop-color="#0D1117"
                      />

                      <stop
                          offset="100%"
                          stop-color="#161B22"
                      />
                  </linearGradient>

              </defs>

              <!-- CARD -->

              <rect
                  x="1"
                  y="1"
                  width="698"
                  height="318"
                  rx="18"
                  fill="url(#background)"
                  stroke="#30363D"
              />

              <!-- TITLE -->

              <text
                  x="30"
                  y="38"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="20"
                  font-weight="bold"
                  fill="#FFFFFF"
              >
                  GitHub Statistics
              </text>

              <!-- DONUT -->

              {donut}

              <!-- DONUT CENTER -->

              <circle
                  cx="145"
                  cy="150"
                  r="60"
                  fill="#0D1117"
              />

              <text
                  x="145"
                  y="145"
                  text-anchor="middle"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="22"
                  font-weight="bold"
                  fill="#FFFFFF"
              >
                  {total}
              </text>

              <text
                  x="145"
                  y="168"
                  text-anchor="middle"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="12"
                  fill="#8B949E"
              >
                  Total
              </text>

              <!-- LEGEND -->

              {legend}

              <!-- FOOTER -->

              <text
                  x="350"
                  y="295"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="11"
                  fill="#6E7681"
              >
                  @{USERNAME}
              </text>

          </svg>
          """

          # =============================================================
          #  CARD 2: PROFILE DETAILS
          # =============================================================

          # Build contribution area chart
          chart_width = 380
          chart_height = 110
          num_points = len(weekly_totals)

          if num_points > 1:
              x_step = chart_width / (num_points - 1)
          else:
              x_step = chart_width

          # Build smooth area path
          points = []
          for i, w in enumerate(weekly_totals):
              x = i * x_step
              y = chart_height - (w["count"] / max_weekly * chart_height) if max_weekly > 0 else chart_height
              points.append((x, y))

          # SVG path for area chart using Catmull-Rom-like curve
          def catmull_rom_to_bezier(p0, p1, p2, p3, tension=0.5):
              """Convert 4 Catmull-Rom points to a cubic bezier segment."""
              d1x = (p2[0] - p0[0]) * tension
              d1y = (p2[1] - p0[1]) * tension
              d2x = (p3[0] - p1[0]) * tension
              d2y = (p3[1] - p1[1]) * tension
              return (
                  p1[0] + d1x / 3, p1[1] + d1y / 3,
                  p2[0] - d2x / 3, p2[1] - d2y / 3,
                  p2[0], p2[1]
              )

          if len(points) >= 2:
              # Build smooth curve path
              path_parts = [f"M{points[0][0]:.1f},{points[0][1]:.1f}"]

              for i in range(len(points) - 1):
                  p0 = points[max(i - 1, 0)]
                  p1 = points[i]
                  p2 = points[i + 1]
                  p3 = points[min(i + 2, len(points) - 1)]

                  cp1x, cp1y, cp2x, cp2y, ex, ey = catmull_rom_to_bezier(p0, p1, p2, p3)
                  path_parts.append(f"C{cp1x:.1f},{cp1y:.1f},{cp2x:.1f},{cp2y:.1f},{ex:.1f},{ey:.1f}")

              curve_path = "".join(path_parts)

              # Close path for fill area
              area_path = curve_path + f"L{points[-1][0]:.1f},{chart_height}L0,{chart_height}Z"
          else:
              area_path = f"M0,{chart_height}L{chart_width},{chart_height}L{chart_width},{chart_height}L0,{chart_height}Z"

          # Build x-axis labels (show ~7 labels evenly spread)
          num_labels = min(7, num_points)
          x_axis_labels = ""
          if num_points > 0:
              step = max(1, num_points // (num_labels - 1)) if num_labels > 1 else 1
              label_indices = list(range(0, num_points, step))
              if label_indices[-1] != num_points - 1:
                  label_indices.append(num_points - 1)

              for idx in label_indices:
                  x = idx * x_step
                  d = datetime.strptime(weekly_totals[idx]["date"], "%Y-%m-%d")
                  label = d.strftime("%y/%m")
                  x_axis_labels += f"""
                  <g transform="translate({x:.1f},0)">
                      <line stroke="#a9fef7" y2="6"/>
                      <text fill="#a9fef7" y="9" dy="0.71em" text-anchor="middle" font-size="10" font-family="sans-serif">{label}</text>
                  </g>
                  """

          # Build y-axis labels
          y_axis_labels = ""
          num_y_ticks = min(6, max_weekly + 1)
          for i in range(num_y_ticks):
              val = round(max_weekly * i / (num_y_ticks - 1)) if num_y_ticks > 1 else 0
              y = chart_height - (val / max_weekly * chart_height) if max_weekly > 0 else chart_height
              y_axis_labels += f"""
              <g transform="translate(0,{y:.1f})">
                  <line stroke="#a9fef7" x2="6"/>
                  <text fill="#a9fef7" x="9" dy="0.32em" font-size="10" font-family="sans-serif">{val}</text>
              </g>
              """

          svg_profile = f"""<svg xmlns="http://www.w3.org/2000/svg" width="700" height="200" viewBox="0 0 700 200">
          <rect x="1" y="1" rx="5" ry="5" height="99%" width="99.7%" stroke="#141321" stroke-width="1" fill="#141321"/>

          <!-- Title -->
          <text x="30" y="40" font-family="Segoe UI, Ubuntu, Helvetica Neue, sans-serif" font-size="22" fill="#fe428e" font-weight="bold">{USERNAME}</text>

          <!-- User info -->
          <g transform="translate(30,70)">
              <!-- Contributions icon -->
              <g transform="translate(0,0)">
                  <g width="14" height="14" fill="#f8d847">
                      <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                  </g>
                  <text x="21" y="14" fill="#a9fef7" font-size="14" font-family="Segoe UI, Ubuntu, Helvetica Neue, sans-serif">{total_contributions} Contributions on GitHub</text>
              </g>

              <!-- Repos icon -->
              <g transform="translate(0,28)">
                  <g width="14" height="14" fill="#f8d847">
                      <path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"/>
                  </g>
                  <text x="21" y="14" fill="#a9fef7" font-size="14" font-family="Segoe UI, Ubuntu, Helvetica Neue, sans-serif">{repositories} Public Repos</text>
              </g>

              <!-- Clock icon -->
              <g transform="translate(0,56)">
                  <g width="14" height="14" fill="#f8d847">
                      <path fill-rule="evenodd" d="M1.5 8a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0zM8 0a8 8 0 100 16A8 8 0 008 0zm.5 4.75a.75.75 0 00-1.5 0v3.5a.75.75 0 00.471.696l2.5 1a.75.75 0 00.557-1.392L8.5 7.742V4.75z"/>
                  </g>
                  <text x="21" y="14" fill="#a9fef7" font-size="14" font-family="Segoe UI, Ubuntu, Helvetica Neue, sans-serif">{joined_text}</text>
              </g>
          </g>

          <!-- Contribution chart -->
          <g transform="translate(295,50)">
              <clipPath id="gpsc-clip">
                  <rect x="-30" y="0" width="410" height="{chart_height}"/>
              </clipPath>
              <g clip-path="url(#gpsc-clip)">
                  <path transform="translate(-30,0)" stroke="#ae81ff" fill="#ae81ff" opacity="1" d="{area_path}"/>
              </g>
              <!-- X axis -->
              <g color="#a9fef7" transform="translate(-30,{chart_height})" fill="none" font-size="10" text-anchor="middle">
                  <path class="domain" stroke="currentColor" d="M0.5,6V0.5H{chart_width}.5V6"/>
                  {x_axis_labels}
              </g>
              <!-- Y axis -->
              <g color="#a9fef7" transform="translate({chart_width - 30},0)" fill="none" font-size="10" text-anchor="start">
                  <path class="domain" stroke="currentColor" d="M6,{chart_height}.5H0.5V0.5H6"/>
                  {y_axis_labels}
              </g>
              <!-- Chart title -->
              <text y="-15" x="230" fill="#a9fef7" font-size="10" font-family="Segoe UI, Ubuntu, Helvetica Neue, sans-serif">contributions in the last year</text>
          </g>
          </svg>
          """

          # =============================================================
          #  CARD 3: STREAK STATS
          # =============================================================

          current_streak_date = ""
          if current_streak_start and current_streak_end:
              if current_streak_start == current_streak_end:
                  current_streak_date = format_date_short(current_streak_start)
              else:
                  current_streak_date = format_date_range(current_streak_start, current_streak_end)
          elif current_streak == 0:
              current_streak_date = ""

          longest_streak_date = ""
          if longest_start and longest_end:
              if longest_start == longest_end:
                  longest_streak_date = format_date_short(longest_start)
              else:
                  longest_streak_date = format_date_range(longest_start, longest_end)

          svg_streak = f"""<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink'
                  viewBox='0 0 495 195' width='495px' height='195px'>
          <defs>
              <clipPath id='outer_rectangle'>
                  <rect width='495' height='195' rx='4.5'/>
              </clipPath>
          </defs>
          <g clip-path='url(#outer_rectangle)'>
              <rect fill='#141321' rx='4.5' x='0.5' y='0.5' width='494' height='194'/>
              <line x1='165' y1='28' x2='165' y2='170' stroke-width='1' stroke='#E4E2E2'/>
              <line x1='330' y1='28' x2='330' y2='170' stroke-width='1' stroke='#E4E2E2'/>

              <!-- Total Contributions -->
              <g transform='translate(82.5, 48)'>
                  <text x='0' y='32' text-anchor='middle' fill='#FE428E' font-family='Segoe UI, Ubuntu, sans-serif' font-weight='700' font-size='28'>
                      {total_contributions}
                  </text>
              </g>
              <g transform='translate(82.5, 84)'>
                  <text x='0' y='32' text-anchor='middle' fill='#FE428E' font-family='Segoe UI, Ubuntu, sans-serif' font-weight='400' font-size='14'>
                      Total Contributions
                  </text>
              </g>
              <g transform='translate(82.5, 114)'>
                  <text x='0' y='32' text-anchor='middle' fill='#A9FEF7' font-family='Segoe UI, Ubuntu, sans-serif' font-weight='400' font-size='12'>
                      {contribution_range}
                  </text>
              </g>

              <!-- Current Streak -->
              <g transform='translate(247.5, 108)'>
                  <text x='0' y='32' text-anchor='middle' fill='#F8D847' font-family='Segoe UI, Ubuntu, sans-serif' font-weight='700' font-size='14'>
                      Current Streak
                  </text>
              </g>
              <g transform='translate(247.5, 145)'>
                  <text x='0' y='21' text-anchor='middle' fill='#A9FEF7' font-family='Segoe UI, Ubuntu, sans-serif' font-weight='400' font-size='12'>
                      {current_streak_date}
                  </text>
              </g>
              <!-- Ring -->
              <circle cx='247.5' cy='71' r='40' fill='none' stroke='#FE428E' stroke-width='5'/>
              <!-- Fire icon -->
              <g transform='translate(247.5, 19.5)'>
                  <path d='M -12 -0.5 L 15 -0.5 L 15 23.5 L -12 23.5 L -12 -0.5 Z' fill='none'/>
                  <path d='M 1.5 0.67 C 1.5 0.67 2.24 3.32 2.24 5.47 C 2.24 7.53 0.89 9.2 -1.17 9.2 C -3.23 9.2 -4.79 7.53 -4.79 5.47 L -4.76 5.11 C -6.78 7.51 -8 10.62 -8 13.99 C -8 18.41 -4.42 22 0 22 C 4.42 22 8 18.41 8 13.99 C 8 8.6 5.41 3.79 1.5 0.67 Z M -0.29 19 C -2.07 19 -3.51 17.6 -3.51 15.86 C -3.51 14.24 -2.46 13.1 -0.7 12.74 C 1.07 12.38 2.9 11.53 3.92 10.16 C 4.31 11.45 4.51 12.81 4.51 14.2 C 4.51 16.85 2.36 19 -0.29 19 Z' fill='#FE428E'/>
              </g>
