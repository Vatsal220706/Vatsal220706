          """

          # =============================
          # WRITE ALL SVGs
          # =============================

          os.makedirs("assets", exist_ok=True)

          with open(OUTPUT_STATS, "w", encoding="utf-8") as f:
              f.write(svg_stats)

          with open(OUTPUT_PROFILE, "w", encoding="utf-8") as f:
              f.write(svg_profile)

          with open(OUTPUT_STREAK, "w", encoding="utf-8") as f:
              f.write(svg_streak)

          print("GitHub statistics updated:")
          print("Commits:", commits)
          print("Pull Requests:", pull_requests)
          print("Issues:", issues)
          print("Stars:", stars)
          print("Repositories:", repositories)
          print("Total:", total)
          print()
          print("Contributions:", total_contributions)
          print("Current Streak:", current_streak)
          print("Longest Streak:", longest_streak)
          PY

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg assets/profile-details.svg assets/streak-stats.svg

          if git diff --cached --quiet; then
            echo "No changes to GitHub statistics."
          else
            git commit -m "chore: update GitHub statistics"
            git push
          fi