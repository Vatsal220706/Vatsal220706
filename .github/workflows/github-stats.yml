      - name: Generate Top Languages SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PY2'
          import json, os, urllib.request

          USERNAME = "Vatsal220706"
          OUTPUT_LANGS = "assets/top-langs.svg"
          OUTPUT_LANGS_LIGHT = "assets/top-langs-light.svg"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          def api(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          repos = []
          page = 1
          while True:
              data = api(f"https://api.github.com/users/{USERNAME}/repos?per_page=100&page={page}&type=owner")
              if not data:
                  break
              repos.extend(data)
              if len(data) < 100:
                  break
              page += 1

          lang_bytes = {}
          for repo in repos:
              try:
                  ld = api(f"https://api.github.com/repos/{USERNAME}/{repo['name']}/languages")
                  for lang, b in ld.items():
                      lang_bytes[lang] = lang_bytes.get(lang, 0) + b
              except Exception:
                  pass

          sorted_langs = sorted(lang_bytes.items(), key=lambda x: x[1], reverse=True)[:8]
          total_bytes = sum(b for _, b in sorted_langs) or 1

          lang_colors = {
              "Python":"#3572A5","JavaScript":"#f1e05a","TypeScript":"#2b7489",
              "Java":"#b07219","C":"#555555","C++":"#f34b7d","C#":"#178600",
              "Go":"#00ADD8","Rust":"#dea584","Ruby":"#701516","PHP":"#4F5D95",
              "Swift":"#F05138","Kotlin":"#A97BFF","Dart":"#00B4AB",
              "HTML":"#e34c26","CSS":"#563d7c","Shell":"#89e051",
              "Dockerfile":"#384d54","Jupyter Notebook":"#DA5B0B",
              "SCSS":"#c6538c","Vue":"#41b883","Svelte":"#ff3e00",
          }
          def_colors = ["#8B5CF6","#EC4899","#F59E0B","#10B981","#3B82F6","#EF4444","#14B8A6","#F97316"]

          card_w = 300
          card_h = 60 + len(sorted_langs) * 28 + 30
          bar_w = 260
          bar_x = 20

          bar_segs = ""
          off = 0
          for i, (lang, bc) in enumerate(sorted_langs):
              pct = bc / total_bytes
              sw = round(pct * bar_w, 2)
              col = lang_colors.get(lang, def_colors[i % len(def_colors)])
              bar_segs += f'<rect x="{bar_x + off:.2f}" y="50" width="{sw}" height="10" fill="{col}"/>'
              off += sw

          LANGS_THEMES = {
              "dark": {
                  "bg": "#161B22",
                  "border": "#30363D",
                  "title": "#EDEDED",
                  "lang": "#EDEDED",
                  "pct": "#A0A0A0",
              },
              "light": {
                  "bg": "#FFFFFF",
                  "border": "#D0D7DE",
                  "title": "#1F2328",
                  "lang": "#1F2328",
                  "pct": "#57606A",
              },
          }

          def render_langs_svg(t):
              legend = ""
              for i, (lang, bc) in enumerate(sorted_langs):
                  pct = bc / total_bytes * 100
                  col = lang_colors.get(lang, def_colors[i % len(def_colors)])
                  y = 80 + i * 28
                  legend += (
                      f'<circle cx="{bar_x+6}" cy="{y+6}" r="6" fill="{col}"/>'
                      f'<text x="{bar_x+18}" y="{y+11}" font-family="Segoe UI,Ubuntu,sans-serif" font-size="13" fill="{t["lang"]}">{lang}</text>'
                      f'<text x="{card_w-10}" y="{y+11}" text-anchor="end" font-family="Segoe UI,Ubuntu,sans-serif" font-size="13" fill="{t["pct"]}">{pct:.1f}%</text>'
                  )

              return (
                  f'<svg xmlns="http://www.w3.org/2000/svg" width="{card_w}" height="{card_h}" viewBox="0 0 {card_w} {card_h}">'
                  f'<defs><linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">'
                  f'<stop offset="0%" stop-color="#38BDF8"/><stop offset="50%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#1D4ED8"/>'
                  f'</linearGradient></defs>'
                  f'<rect x="1.5" y="1.5" width="{card_w - 3}" height="{card_h - 3}" rx="12" ry="12" fill="{t["bg"]}" stroke="url(#border-grad)" stroke-width="2.5"/>'
                  f'<text x="20" y="30" font-family="Segoe UI,Ubuntu,sans-serif" font-size="16" font-weight="700" fill="{t["title"]}">Most Used Languages</text>'
                  f'{bar_segs}{legend}</svg>'
              )

          os.makedirs("assets", exist_ok=True)
          with open(OUTPUT_LANGS, "w", encoding="utf-8") as f:
              f.write(render_langs_svg(LANGS_THEMES["dark"]))

          with open(OUTPUT_LANGS_LIGHT, "w", encoding="utf-8") as f:
              f.write(render_langs_svg(LANGS_THEMES["light"]))

          print("Top languages:", [l for l, _ in sorted_langs])
          PY2
