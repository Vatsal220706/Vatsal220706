name: Update GitHub Stats Card

on:
  push:
    branches:
      - main
      - vatsal
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import math
          import os
          import urllib.request

          USERNAME = "Vatsal220706"
          OUTPUT = "assets/github-stats.svg"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          def api(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          # -----------------------------
          # GET USER INFORMATION
          # -----------------------------

          user = api(f"https://api.github.com/users/{USERNAME}")

          repositories = user["public_repos"]

          # -----------------------------
          # GET ALL PUBLIC REPOSITORIES
          # -----------------------------

          repos = []
          page = 1

          while True:
              data = api(
                  f"https://api.github.com/users/{USERNAME}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1

          stars = sum(repo["stargazers_count"] for repo in repos)

          # -----------------------------
          # PULL REQUESTS
          # -----------------------------

          pr_data = api(
              f"https://api.github.com/search/issues"
              f"?q=author:{USERNAME}+type:pr"
          )

          pull_requests = pr_data["total_count"]

          # -----------------------------
          # ISSUES
          # -----------------------------

          issue_data = api(
              f"https://api.github.com/search/issues"
              f"?q=author:{USERNAME}+type:issue"
          )

          issues = issue_data["total_count"]

          # -----------------------------
          # COMMITS
          # -----------------------------

          commit_data = api(
              f"https://api.github.com/search/commits"
              f"?q=author:{USERNAME}"
          )

          commits = commit_data["total_count"]

          # -----------------------------
          # STATISTICS
          # -----------------------------

          values = [
              commits,
              pull_requests,
              issues,
              stars,
              repositories
          ]

          colors = [
              "#3B82F6",
              "#8B5CF6",
              "#22C55E",
              "#F59E0B",
              "#EC4899"
          ]

          labels = [
              "Commits",
              "Pull Requests",
              "Issues",
              "Stars",
              "Repositories"
          ]

          total = sum(values)

          # Prevent division by zero
          if total == 0:
              total = 1

          # -----------------------------
          # DONUT SETTINGS
          # -----------------------------

          cx = 145
          cy = 150
          radius = 92

          circumference = 2 * math.pi * radius

          circles = []

          offset = 0

          for value, color in zip(values, colors):

              length = circumference * value / total

              circles.append(f"""
              <circle
                  cx="{cx}"
                  cy="{cy}"
                  r="{radius}"
                  fill="none"
                  stroke="{color}"
                  stroke-width="25"
                  stroke-dasharray="{length:.2f} {circumference:.2f}"
                  stroke-dashoffset="-{offset:.2f}"
                  transform="rotate(-90 {cx} {cy})"
              />
              """)

              offset += length

          donut = "".join(circles)

          # -----------------------------
          # LEGEND
          # -----------------------------

          legend = ""

          y_positions = [70, 110, 150, 190, 230]

          for label, value, color, y in zip(
              labels,
              values,
              colors,
              y_positions
          ):

              legend += f"""
              <circle
                  cx="355"
                  cy="{y}"
                  r="6"
                  fill="{color}"
              />

              <text
                  x="375"
                  y="{y + 5}"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="15"
                  fill="#C9D1D9"
              >
                  {label}
              </text>

              <text
                  x="640"
                  y="{y + 5}"
                  text-anchor="end"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="15"
                  font-weight="bold"
                  fill="#FFFFFF"
              >
                  {value}
              </text>
              """

          # -----------------------------
          # FINAL SVG
          # -----------------------------

          svg = f"""<svg
              width="700"
              height="320"
              viewBox="0 0 700 320"
              xmlns="http://www.w3.org/2000/svg"
          >

              <defs>

                  <linearGradient
                      id="background"
                      x1="0"
                      y1="0"
                      x2="1"
                      y2="1"
                  >
                      <stop
                          offset="0%"
                          stop-color="#0D1117"
                      />

                      <stop
                          offset="100%"
                          stop-color="#161B22"
                      />
                  </linearGradient>

              </defs>

              <!-- CARD -->

              <rect
                  x="1"
                  y="1"
                  width="698"
                  height="318"
                  rx="18"
                  fill="url(#background)"
                  stroke="#30363D"
              />

              <!-- TITLE -->

              <text
                  x="30"
                  y="38"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="20"
                  font-weight="bold"
                  fill="#FFFFFF"
              >
                  GitHub Statistics
              </text>

              <!-- DONUT -->

              {donut}

              <!-- DONUT CENTER -->

              <circle
                  cx="145"
                  cy="150"
                  r="60"
                  fill="#0D1117"
              />

              <text
                  x="145"
                  y="145"
                  text-anchor="middle"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="22"
                  font-weight="bold"
                  fill="#FFFFFF"
              >
                  {total}
              </text>

              <text
                  x="145"
                  y="168"
                  text-anchor="middle"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="12"
                  fill="#8B949E"
              >
                  Total
              </text>

              <!-- LEGEND -->

              {legend}

              <!-- FOOTER -->

              <text
                  x="350"
                  y="295"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="11"
                  fill="#6E7681"
              >
                  @{USERNAME}
              </text>

          </svg>
          """

          os.makedirs("assets", exist_ok=True)

          with open(OUTPUT, "w", encoding="utf-8") as f:
              f.write(svg)

          print("GitHub statistics updated:")
          print("Commits:", commits)
          print("Pull Requests:", pull_requests)
          print("Issues:", issues)
          print("Stars:", stars)
          print("Repositories:", repositories)
          print("Total:", total)
          PY

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg

          if git diff --cached --quiet; then
            echo "No changes to GitHub statistics."
          else
            git commit -m "chore: update GitHub statistics"
            git push
          fi