name: Update Profile Details

on:
  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: Vatsal220706
          BRANCH_NAME: main
          UTC_OFFSET: 5.5
          THEME: radical

      - name: Copy profile details card to assets
        run: |
          mkdir -p assets

          cp profile-summary-card-output/radical/1-profile-details.svg assets/profile-details.svg

      - name: Commit profile details card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/profile-details.svg

          if git diff --cached --quiet; then
            echo "No changes to profile-details.svg"
            exit 0
          fi

          git commit -m "ci: update profile details card"
          git push