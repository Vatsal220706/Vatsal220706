              <rect x="11.5" y="11.5" width="477.0" height="207.0" rx="4.0" ry="4.0" fill="none" stroke="url(#border-grad)" stroke-width="5.0" stroke-opacity="0.11"/>
              <rect x="16.0" y="16.0" width="468.0" height="198.0" rx="1" ry="1" fill="none" stroke="url(#border-grad)" stroke-width="5.0" stroke-opacity="0.04"/>
    <line x1='166.7' y1='34' x2='166.7' y2='196' stroke-width='1' stroke='#D0D7DE'/>
